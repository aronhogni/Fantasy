name: fetch-data

on:
  schedule:
    - cron: "0 5 * * *"     # 05:00 UTC daglega
  workflow_dispatch: {}      # handvirk keyrsla úr Actions-flipanum

permissions:
  contents: write

# SAMHLIDA KEYRSLUR MATTU SKARAST (lagad 11.8.2026). fetch-fast og nfl-data
# hofdu bædi `concurrency`-hop; ThESSI, sem er thyngsta keyrslan og skrifar
# FLEST svid i `data/`, hafdi ekki. Handvirk `workflow_dispatch` sem lendir
# ofan i 05:00-cron-inu gaf ThVI TVAER dagkeyrslur samtimis — og thar sem
# push-arekstrar leysast med `rebase -X theirs` gat utkoman verid gogn ur
# BADUM keyrslum, skra fyrir skra, i stad heillar myndar ur einni.
# `cancel-in-progress: false` er asett: keyrsla sem er komin halfa leid hefur
# thegar brennt API-kvota, svo hun a ad fa ad ljuka — hin bidur.
concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sækja gögn
        env:
          ENABLE_ELO: "true"
          ENABLE_FDCOUK: "true"
          ENABLE_WEATHER: "true"
          ENABLE_EURO: "true"
          ENABLE_TRAVEL: "true"
          ENABLE_DERIVED: "true"
          EURO_API_KEY: ${{ secrets.EURO_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          # BSD VANTADI HER — OG ThAD VAR SAMA VILLAN OG I fetch-fast.yml.
          # `fetchBsdLive()` er kallad AÐEINS ur daglegu keyrslunni (merkt
          # "DAGLEGA, EKKI --fast" i fetch.mjs), en thessi blokk gaf ekki
          # BSD_KEY — svo FLAGS.bsd var false og bsd_live.json var ALDREI
          # skrifud i CI. Fallid leit ut fyrir ad vera tengt, stadan var
          # graen og enginn sa neitt. Nakvaemlega lineups-sagan (CLAUDE.md
          # 7.1) endurtekin i hinni attina. Vordur: workflow-push.mjs
          # ber nu saman lyklana sem FLAGS les vid thad sem HVERT workflow
          # gefur, svo thetta geti ekki gerst i thridja sinn.
          BSD_KEY: ${{ secrets.BSD_KEY }}
        run: node scripts/fetch.mjs

      # SPA-BOKHALDID ER LIKA KALLAD HER — MAELT 28.8.2026
      #
      # Thad var adeins i `fetch-fast` af theirri astaedu ad hun gengur a 30
      # min fresti og "naer thvi alltaf glugganum fyrir frest". SU FULLYRDING
      # ER MAELD OSONN: GW2-rodin (frestur 28.8. kl. 17:30) TAPADIST, thvi
      # engin hrad keyrsla for i gang milli kl. 05:04 og 17:34 — 12,5 klst
      # bil thvert yfir gluggann. Yfir 100 keyrslur er midgildi bilsins 0,79
      # klst og p90 1,58, en MESTA BILID 12,5; ein throttlud nott taekur thvi
      # umferdina, og rodin er ekki endurheimtanleg (inntokin hverfa vid
      # frestinn).
      #
      # Tvaer olikar cron-skrar bresta ekki a sama tima, svo thetta er odyr
      # ovissu-vorn. Skriftan ver sig sjalf gegn tvitekningu: rod sem er
      # komin innan 12 klst bandsins er ALDREI endurskrifud og ekkert er
      # skrifad eftir frestinn (sja `shouldWrite`).
      #
      # `continue-on-error` af somu astaedu og i hradri keyrslu: bokhaldid er
      # maelitaeki og ma aldrei fella gagna-keyrsluna.
      - name: Skra spa (bokhald)
        continue-on-error: true
        run: node scripts/snapshot-predictions.mjs

      - name: Committa ef eitthvað breyttist
        run: |
          set -uo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Engar breytingar — sleppi commit."
            exit 0
          fi
          git commit -m "data: $(date -u +%Y-%m-%d)"
          # KAPPHLAUPIÐ SEM FELLDI fetch-data 29.7.2026 kl. 07:40:
          # fetch-fast pushaði 12 SEKÚNDUM á undan, svo þessu pushi var
          # HAFNAÐ ("fetch first") og heill dagur af sóttum gögnum fór í
          # ruslið þegjandi — keyrslan varð rauð en engin gögn töpuðust
          # sýnilega. fetch.yml hafði ENGA pull; fetch-fast hafði pull en
          # ÁÐUR en hún committaði, svo hún gat líka fallið á push.
          #
          # Endurtilraun ofan á fjarlægu greininni. Við árekstur í data/
          # vinnur OKKAR fersk sókn: í rebase er "theirs" það commit sem er
          # endurspilað (okkar), ekki upprunagreinin. Það er rétt hér því
          # data/ er endurmyndað í heild í hverri keyrslu — nýrri sókn er
          # alltaf réttari en sú sem var á undan.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushað í tilraun $i"
              exit 0
            fi
            echo "push hafnað (tilraun $i) — endurstilli ofan á origin/main"
            git fetch origin main || { echo "::error::git fetch brast"; exit 1; }
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::rebase brast — engin gögn pushuð"
              exit 1
            fi
            sleep $((i * 4))
          done
          echo "::error::push mistókst eftir 5 tilraunir"
          exit 1
