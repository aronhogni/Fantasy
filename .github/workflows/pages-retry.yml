# Endurræsir pages-keyrslu sem FELLUR — sjálfvirkt, með þaki.
#
# HVERS VEGNA: 6.8.2026 var skráð atvik hjá GitHub ("Pages - Deployment
# Lag"): deployment festist í "deployment_in_progress" þar til action-ið
# tímaði út. Innri endurtilraunin í pages.yml (tvær tilraunir) réð við
# stutta hiksta, en langt atvik fellir BÁÐAR tilraunir og þá stæði síðan
# á gamalli útgáfu þar til næsta kóða-ýting kæmi — sem í forleik getur
# verið dögum seinna. Þetta workflow gerir það sem manneskjan gerði í
# höndunum (gh run rerun --failed), sjálfkrafa, eftir 4 mín bið.
#
# ÞAKIÐ: run_attempt < 5. Hver endurræsing hækkar attempt-töluna, svo
# lykkjan stöðvast af sjálfri sér eftir ~5 tilraunir (~1,5 klst glugga
# með innri tilraununum). Falli allt það er raunveruleg bilun sem
# tölvupósturinn á að fá að segja frá.
name: pages-retry

on:
  workflow_run:
    workflows: [pages]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 5
    runs-on: ubuntu-latest
    steps:
      - name: Bíða og endurræsa föllnu störfin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # BIÐIN VEX MEÐ TILRAUNUM: 4 /, 8, 12, 16 mín. Mælt 6.8.2026 í
          # runner-þurrð GitHub ("job was not acquired by Runner of type
          # hosted"): hver tilraun brennur ~15 mín í öflunarröð og fellur —
          # með fastri 4 mín bið kláraðist 5-tilrauna fjárhagurinn á ~80 mín
          # meðan atvikið stóð lengur. Vaxandi bið spannar ~2,5 klst og
          # lifir því lengra atvik af án þess að hækka þakið.
          A=${{ github.event.workflow_run.run_attempt }}
          echo "pages-keyrsla ${{ github.event.workflow_run.id }} féll" \
               "(tilraun $A af 5) — bíð í $((4 * A)) mín."
          sleep $((240 * A))
          # IDEMPOTENT: kallið má mistakast án þess að lita keyrsluna rauða.
          # 6.8.2026 sat þetta workflow í biðröð í >30 mín (Actions-atvikið
          # sjálft) og manneskja endurræsti keyrsluna Á UNDAN því — þá er
          # svar API-sins 4xx ("already running"/"cannot rerun") og það er
          # RÉTT ástand, ekki bilun: einhver annar var fyrri til.
          if gh api -X POST \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"; then
            echo "endurræst."
          else
            echo "endurræsing óþörf eða óhæf (líklega þegar endurræst af öðrum) — í lagi."
          fi
