name: fetch-fast

# Meiðslafréttir, verðbreytingar og leikjastöður uppfærast allan daginn.
# Þetta er létt keyrsla (aðeins bootstrap + fixtures) og KOSTAR EKKERT
# (GitHub Actions er frítt fyrir opinber repo). Netlify byggir ekki —
# ignore-reglan í netlify.toml sleppir byggingu þegar aðeins data/ breytist.
on:
  schedule:
    - cron: "*/30 * * * *"     # á 30 mínútum
    # ÞÉTTARI Á LEIKDÖGUM. Mælt 4.8.2026: GitHub þynnir schedule-keyrslur —
    # */30 skilaði í raun 1-3,5 klst bilum (versta bil 3,7 klst). Í forleik
    # er það meinlaust en á leikdegi er glugginn fyrir staðfest byrjunarlið
    # ~5 klst og liðin birtast ~60 mín fyrir leik: ein keyrsla sem hittir
    # gluggann SNEMMA sækir ekkert og sú næsta gat verið 3 klst seinna.
    # Þéttari cron á leikdaga-tímum (fös/lau/sun/mán 10-21 UTC — PL byrjar
    # 11:30-20:00) þýðir að SAMA þynning gefur ~2-4x fleiri raunkeyrslur.
    # Kvótinn er varinn annars staðar: sótt byrjunarlið eru GEYMD per leik
    # (fetch.mjs) svo fleiri keyrslur endursækja ekki sama leikinn.
    - cron: "*/15 10-21 * * 0,1,5,6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-fast
  cancel-in-progress: true

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sækja fljótandi gögn
        # API_SPORTS_KEY VANTADI HER og thad gerdi stadfest byrjunarlid
        # (fetchLineups) ad DAUDUM KODA: FLAGS.apisports var false i hradu
        # keyrslunni, svo fallid var sleppt thegjandi. Fannst 31.7. med thvi
        # ad RAESA workflowid og sja ad rannsakandi kallid kom aldrei i logid.
        # Lineups tilheyra HRADA keyrslunni (lidin birtast 40-60 min fyrir
        # leik) svo lykillinn verdur ad vera hér, ekki bara i fetch.yml.
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          # BSD: spad byrjunarlid (~13 klst gluggi) og vara-markadslina.
          # AN ThESSA er FLAGS.bsd false og BADA follin eru sleppt THEGJANDI
          # — nakvaemlega villan sem gerdi fetchLineups ad daudum koda
          # (CLAUDE.md 7.1). Vordur: tests/bsd-pipeline.mjs kafli 2.
          BSD_KEY: ${{ secrets.BSD_KEY }}
        run: node scripts/fetch.mjs --fast

      - name: Skra spa (adeins FYRIR frest)
        # SPA-BOKHALDID: skrifar data/predictions/gw{N}.json med thvi sem vid
        # SPADUM — FFDR per leik, rankScore per leikmann, byrjunar-likur — svo
        # tests/calibration.mjs geti sidar spurt hvort maelingarnar HALDI.
        #
        # HER, EKKI I DAGLEGU KEYRSLUNNI: hun gengur kl. 05 UTC en frestur er
        # ~17:30 og leikir 12-19 UTC, svo dagkeyrslan er of langt fra honum.
        # Hrada keyrslan gengur a 30 min fresti (og a 15 min a leikdogum).
        # HUN NAER SAMT EKKI ALLTAF GLUGGANUM — her stod ad hun gerdi thad og
        # thad er MAELT OSATT: GW2-rodin tapadist 28.8.2026 thvi engin keyrsla
        # for i gang milli kl. 05:04 og 17:34 (12,5 klst bil, midgildi 0,79 og
        # p90 1,58 yfir 100 keyrslur). Thess vegna er skriftan nu KOLLUD UR
        # BADUM vinnuskram og fraeglugginn er 36 klst med einni leyfdri
        # uppfaerslu; sja hausinn a `shouldWrite`.
        #
        # `continue-on-error` ER ASETT: bokhaldid er MAELITAEKI, ekki gogn sem
        # appid les. Bresti thad ma thad ALDREI fella gagna-keyrsluna sjalfa —
        # sama rok og BSD er birtingar-heimild en ekki burdarvirki.
        # Skriftan ver sig sjalf: hun skrifar ekkert eftir frest, aldrei tvisvar
        # i somu umferd, og ekkert ur thunnum inntokum.
        continue-on-error: true
        run: node scripts/snapshot-predictions.mjs

      # HLID FYRIR COMMIT — `scripts/validate-data.mjs` (tengt 31.8.2026)
      #
      # Skriftan var skrifud 25.8.2026 og var TENGD ENGU: hvorki vinnuskrar,
      # `package.json` ne prof kolludu hana. Hun er hlid sem hafnar commit-i
      # (`exit 1`) thegar snapshot er skemmt — og nakvaemlega su tegund
      # bilunar sem hun er til fyrir SLAPP I GEGN 29.8.2026: `lineups.json`
      # for ur 40 leikmonnum i 0 og var committud. Endurspilad a
      # commit-sogunni hafnar hlidid theirri breytingu ordrett
      # ("players: 40 -> 0"). Vordur sem keyrir ekki er ekki vordur
      # (CLAUDE.md 5).
      #
      # ENGIN `continue-on-error` HER — OG ThAD ER MUNURINN A ThESSU SKREFI
      # OG SPA-BOKHALDINU: bokhaldid er maelitaeki og ma ekki fella
      # keyrsluna, en thetta hlid ER tilgangurinn. Bresti thad a commit-ID
      # AD stodvast; appid les `data/` beint af raw.githubusercontent, svo
      # skemmd skra fer oleidrett i vafra notandans.
      - name: Hlid - sannreyna snapshot fyrir commit
        run: node scripts/validate-data.mjs

      - name: Committa ef eitthvað breyttist
        run: |
          set -uo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Engar breytingar — sleppi commit."
            exit 0
          fi
          git commit -m "fast: $(date -u +%Y-%m-%dT%H:%MZ)"
          # KAPPHLAUPIÐ SEM FELLDI fetch-data 29.7.2026 kl. 07:40:
          # fetch-fast pushaði 12 SEKÚNDUM á undan, svo þessu pushi var
          # HAFNAÐ ("fetch first") og heill dagur af sóttum gögnum fór í
          # ruslið þegjandi — keyrslan varð rauð en engin gögn töpuðust
          # sýnilega. fetch.yml hafði ENGA pull; fetch-fast hafði pull en
          # ÁÐUR en hún committaði, svo hún gat líka fallið á push.
          #
          # Endurtilraun ofan á fjarlægu greininni. Við árekstur í data/
          # vinnur OKKAR fersk sókn: í rebase er "theirs" það commit sem er
          # endurspilað (okkar), ekki upprunagreinin. Það er rétt hér því
          # data/ er endurmyndað í heild í hverri keyrslu — nýrri sókn er
          # alltaf réttari en sú sem var á undan.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushað í tilraun $i"
              exit 0
            fi
            echo "push hafnað (tilraun $i) — endurstilli ofan á origin/main"
            git fetch origin main || { echo "::error::git fetch brast"; exit 1; }
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::rebase brast — engin gögn pushuð"
              exit 1
            fi
            sleep $((i * 4))
          done
          echo "::error::push mistókst eftir 5 tilraunir"
          exit 1
