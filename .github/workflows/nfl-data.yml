name: nfl-data

# ============================================================
# NFL-gagna-pipeline. ALGERLEGA ADSKILID fra FPL-workflow-unum:
# annad safn af skram (nfl/data/), annar keyrslutimi, engir lyklar.
#
# ENGIR LEYNDARDOMAR ERU NOTADIR HER. Allar 20+ NFL-heimildirnar eru
# opnar (nflverse, Sleeper, FantasyPros, FFC, ESPN). Thad er ekki
# tilviljun heldur val: heimild sem krefst lykils dettur ut thegar
# lykillinn rennur ut, og thad gerist alltaf a versta tima.
#
# TVAER ADSKILDAR KEYRSLUR THVI GOGNIN BREYTAST A OLIKUM HRADA:
#   core     ADP, meidsli, spar, linur — DAGLEGA (og tvisvar a dag
#            i drafttid i agust, thegar ADP hreyfist mest)
#   experts  ~230 serfraedingabord — thau uppfaerast nokkrum sinnum
#            i viku og eru 200+ HTTP-koll, svo thau eiga ekki heima
#            i hverri keyrslu
#
#   history  vikuleg leikmanna-gogn — SJA NEDAR, forsendan breyttist
#
# ============================================================
# `history` VAR EKKI HER, OG SU FORSENDA ER FALLIN
# ============================================================
# Hér stod: "Timabil sem er lokid breytist aldrei; thad er sott
# handvirkt." Þad var RETT medan `HISTORY` i `fetch-nfl.mjs` bar
# adeins LOKIN ar. 12.8.2026 var listinn LEIDDUR til ad innihalda
# YFIRSTANDANDI timabil, og tha breytist skrain i hverri viku.
#
# ASTAEDAN ER TVAER MAELDAR NIDURSTODUR sem voru obrukanlegar an hennar:
#   · `usage-lab`: notkun-til-thessa lokar 12,25% af start/sit-bilinu
#     fra viku 10 (a moti 5,83%), per-leikmanns CI [2,54 · 8,49] i
#     ollum thremur snidum — fyrsta hugmyndin sem stodst thann throskuld
#   · `waiver-lab`: rest-of-season gjaldmidill slaer timabils-VBD um
#     +13,2 stig/timabil (t=2,97, 6/7 ar)
# Baðar tharfnast `weekly/{yfirstandandi ar}.json`, sem var ALDREI skrifud.
#
# ÞRIDJUDAGUR, EKKI MANUDAGUR: NFL-vikan endar a manudagskvoldi i BNA,
# svo 12:00 UTC a thridjudegi er fyrsti timinn sem vikan er FULL. Ad
# keyra a manudegi gaefi halfa viku sem las eins og heil.
#
# `weeklyMinRows` i `fetch-nfl.mjs` hleypir yfirstandandi ari i gegn med
# 100 rodum (vika 1 ber ~390) medan lokin ar halda 1000 — annars hefdi
# throskuldurinn HAFNAD fyrstu vikunum, einmitt thegar notkun-til-thessa
# er thad eina sem er til.
#
# ============================================================
# DAGSETTAR SERIUR — OG HVERS VEGNA CRON-ID BREYTTIST EKKI
# ============================================================
# 14.8.2026 var sex heimildum sem VORU I KODANUM en ENGINN KALLADI
# tengt i dagsettar skrar (sja `archiveDaily` i `fetch-nfl.mjs` og
# nyjan kafla i nfl/README.md):
#
#   trending/       (var thegar til)      ~7 KB/dag
#   news/           frettir               ~24 KB/dag
#   adp-history/    FFC-ADP, oll snid    ~127 KB/dag
#   depth/          dyptartafla          ~122 KB/dag
#   weekly-ecr/     vikuleg ECR          ~194 KB per NY `scrape_date`
#   weekly-proj/    vikuleg Sleeper-spa  ~204 KB per viku (18 a timabili)
#   weekly/{ar}     + snap-hlutfoll      (sameinad, engin ny skra)
#
# CRON-ID ER OBREYTT OG THAD ER ASETT. Allar fjorar daglegu seriurnar
# rida a `core`, sem keyrir HVORT SEM ER kl. 09:00 daglega; snap-
# sameiningin ridur a `history` (thridjudaga kl. 12); og ADP-serian er
# LIKA i `--stage=adp` thvi thad threp keyrir 00,03,06,12,15,18 UTC i
# agust-september medan `core` keyrir adeins kl. 09 — falli 09-keyrslan
# ma dagurinn ekki tapast thott ADP hafi verid sott sex sinnum.
#
# `writeOnce` er ONEMANDI a skra sem er thegar til, svo fleiri keyrslur
# a dag safna EKKI upp og skrifa ALDREI ofan i. Dyrasta soknin
# (dyptartaflan, 8,5 MB sem .gz) er SLEPPT ALVEG thegar dagurinn er
# vistadur — `archived()` er spurt a undan `getText`.
#
# ============================================================
# PROFID GETUR NU FELLT KEYRSLUNA UT AF TRENDING — VILJANDI
# ============================================================
# `tests/pipeline.mjs` ber nyjan vord: i AGUST-JANUAR og EFTIR 10:00 UTC
# fellur hann ef dagsmynd DAGSINS I DAG vantar i `trending/`. Þad er
# tengt vid thennan cron: 09:00-keyrslan hefur i verki lokid 09:53-09:56
# (maelt a fjorum keyrslum), svo eftir kl. 10 er skran komin — eda
# vistunin er brotin.
#
# AFLEIDINGIN VAR RAUNVERULEG OG HUN VAR VERRI EN AETLAD VAR. Hér stod
# ad skiptin vaeri "ferskt ADP kemst ekki inn i thad skipti". Þad var
# RETT ordad en VANMAT: profid keyrdi A UNDAN `git add`, svo fall thess
# henti ALLRI keyrslunni — ThAR MED ThEIRRI DAGSMYND SEM VORDURINN VAR
# AD VERJA. Maelt 21.8.2026 (draft-dagurinn): `trending/2026-08-21.json`
# var skrifud i runner-inn kl. 09:5x, profid felldi keyrsluna, skrain
# var aldrei committud — og thess vegna felldi hun 12:19- og
# 15:20-keyrslurnar lika. ThRJAR keyrslur, ekkert ADP.
#
# ROÐIN VAR ThVI SNUID VID 24.8.2026: `Profa ad gognin seu nytileg` er
# nu SIDASTA stepid, eftir commit+push. Rokstudningurinn og hvad skiptin
# kostar stendur vid stepid sjalft nedst i skranni. Vordurinn er
# OBREYTTUR og enn havaer — hann var faerdur, ekki slokktur.
#
# Vordurinn SEFUR i februar-juli svo hann verdi ekki flokkandi i
# sex manudi ("flokt kennir manni ad slokkva a profinu").
#
# ============================================================
# DAGSETT MARKADS-SERIA — 24.8.2026, FORLEIKUR EINGONGU
# ============================================================
# `market/{dagur}.json` (~44 KB/dag) geymir dom markadarins um ALLA 272
# leiki adur en eitt snapp er spilad. ESPN fjarlaegir `odds`-blokkina af
# loknum leikjum (maelt a 2025: 16 leikir, 0 med odds), svo thetta er
# OENDURHEIMTANLEGT — og serian STOPPAR SJALF vid fyrsta leik og skrair
# sig `ok`, thvi rod sem er raud allt timabilid kennir manni ad hunsa
# spjaldid. Engin ny HTTP-koll: linurnar og futures eru ThEGAR sottar
# fyrir `market.json` i somu keyrslu. Cron-id er thvi obreytt.
# ============================================================

on:
  schedule:
    # 09:00 UTC daglega — eftir naeturuppfaerslur ADP-heimildanna.
    - cron: "0 9 * * *"
    # 21:00 UTC i AGUST OG SEPTEMBER: draft-tidin. ADP faerist mest
    # a kvoldin i BNA og bord sem er 12 klst gamalt i draft-viku er
    # ekki nogu ferskt.
    - cron: "0 21 * 8,9 *"
    # ADP EITT OG SER A THRIGGJA TIMA FRESTI I AGUST OG SEPTEMBER.
    # `core` er thungt (11.000 Sleeper-leikmenn, 1,5 milljon rada
    # audkennisbru, ESPN-laug, ECR-sidur) og a ekki ad keyra svona
    # oft — en ADP hreyfist DAGLEGA i drafttid og thad er talan sem
    # radgjofin les mest. `--stage=adp` er fimm HTTP-koll og tekur
    # eina sekundu; thad skrifar ofan i players.json sem er thegar
    # til og endurbyggir enga porun.
    - cron: "0 0,3,6,12,15,18 * 8,9 *"
    # 12:00 UTC A THRIDJUDEGI, SEPTEMBER-JANUAR: vikuleg gogn.
    # Vikan er full eftir manudagskvoldid; sja skyringu i hausnum.
    - cron: "0 12 * * 2"
  workflow_dispatch:
    inputs:
      stage:
        description: "Threp (core | experts | core,experts | history | all)"
        required: false
        default: "core,experts"

permissions:
  contents: write

# Tvaer keyrslur samtimis myndu skrifa sama `nfl/data/` og onnur
# taeki alltaf tapa i push. Betra ad bida.
concurrency:
  group: nfl-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Velja threp
        id: stage
        run: |
          set -euo pipefail
          if [ -n "${{ github.event.inputs.stage }}" ]; then
            echo "value=${{ github.event.inputs.stage }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 0,3,6,12,15,18 * 8,9 *" ]; then
            # ADP-keyrslan: FIMM HTTP-koll, ein sekunda. Hun endurbyggir
            # enga porun heldur skrifar ny ADP-gildi ofan i players.json
            # sem er thegar til. Thess vegna ma hun keyra svona oft.
            echo "value=adp" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 12 * * 2" ]; then
            # VIKULEG GOGN. `history` skrifar `weekly/{ar}.json` fyrir
            # oll ar 2019..yfirstandandi — thad eru ~7 nflverse-skrar og
            # tekur um minutu. `core` fylgir med thvi `meta.json` verdur
            # ad vera ferskt: `historyYears()` les timabilid UR HENNI, og
            # i januar er dagsetningar-arid EKKI timabilid.
            echo "value=core,history" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 21 * 8,9 *" ]; then
            # Kvoldkeyrslan i drafttid: ADP hreyfist, bordin ekki.
            echo "value=core" >> "$GITHUB_OUTPUT"
          else
            echo "value=core,experts" >> "$GITHUB_OUTPUT"
          fi

      - name: Saekja NFL-gogn
        env:
          # ENGIN skyndiminni i CI — thar eiga fersk gogn ad raeda.
          # Skyndiminnid er throunartaeki og a ad frysta heiminn
          # medan verid er ad maela, ekki i sjalfvirkri keyrslu.
          NFL_NO_CACHE: "1"
        working-directory: nfl
        run: node scripts/fetch-nfl.mjs --stage=${{ steps.stage.outputs.value }}

      - name: Maela serfraedinga (adeins thegar bordin voru sott)
        if: contains(steps.stage.outputs.value, 'experts')
        # Fellur EKKI keyrsluna: maelingin krefst `weekly/` sem er
        # committad handvirkt, og ef thad vantar eiga fersku
        # kjarnagognin samt ad komast inn.
        continue-on-error: true
        working-directory: nfl
        run: node scripts/measure-experts.mjs

      - name: Skra radgjof (bokhaldid)
        # ============================================================
        # RADGJAFAR-BOKHALDID — SKRIFAR ThAD SEM APPID SAGDI, FYRIR VIKUNA
        # ============================================================
        # `snapshot-advice.mjs` skrifar `nfl/data/advice/{ar}-w{vika}.json`
        # med start/sit, waiver-tillogum og DST-streymi ASAMT INNTOKUNUM
        # (markadslina, motherji, vorn-gegn-stodu, tiltaekileiki), i 48
        # klst glugga fyrir fyrsta leik vikunnar og ADEINS EINU SINNI.
        #
        # HVERS VEGNA ThAD ER EKKI HAEGT EFTIR A: inntokin eru horfin.
        # Linan hverfur eftir leik, rostrar breytast, og `defense.json` er
        # endurskrifud i hverri viku. Sama roksemd og `data/history/` og
        # `scripts/snapshot-predictions.mjs` i FPL-hlutanum.
        #
        # `continue-on-error: true` ER ASETT OG ThAD ER REGLAN: bokhaldid
        # er MAELITAEKI og ma ALDREI fella soknina a fersku gognunum. En
        # thad thydir ad bilun INNAN gluggans yrdi ThOGUL, svo skriftan
        # skrifar sjalf rod i `status.json` (`advice_ledger`) sem
        # `Sources`-flipinn birtir — og reglan thar er: skip er GRAENT,
        # **gluggi opinn + engin skra er RAUTT**.
        #
        # `NFL_LEDGER_USER` VERDUR AD VERA STILLT SVO START/SIT SE SKRAD.
        # Sleeper gefur enga leid ad vita HVER af tiu eigendum er
        # notandinn; appid veit thad ur `localStorage`, pipelinan ekki. An
        # hans ber rodin waiver og DST en `startsit: null` MED astaedu —
        # sagt, ekki giskad. Thad er `vars`, ekki `secrets`: notandanafn a
        # Sleeper er opinbert.
        continue-on-error: true
        working-directory: nfl
        env:
          NFL_LEDGER_USER: ${{ vars.NFL_LEDGER_USER }}
        run: node scripts/snapshot-advice.mjs

      - name: Committa ef eitthvad breyttist
        run: |
          set -uo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          # AFMARKAD `git add`, ALDREI `-A`. Tvaer lotur hafa unnid a
          # thessu tre samtimis og `-A` sopadi vinnu annarrar inn i
          # commit hinnar (CLAUDE.md kafli 2).
          git add nfl/data
          if git diff --staged --quiet; then
            echo "Engar breytingar — slepp commit."
            exit 0
          fi
          git commit -m "nfl: ${{ steps.stage.outputs.value }} $(date -u +%Y-%m-%dT%H:%MZ)"

          # SAMA KAPPHLAUP OG I fetch.yml, sama lausn. FPL-workflow-in
          # tvo committa `data/` a 30 min fresti; thetta committar
          # `nfl/data/`. Skrarnar rekast ekki a en PUSHID gerir thad.
          #
          # Vid arekstur vinnur okkar ferska sokn (`-X theirs` — i
          # rebase er "theirs" thad commit sem er endurspilad, the.
          # okkar). Thad er rett hér af somu astaedu og thar:
          # `nfl/data/` er endurmyndad I HEILD i hverri keyrslu.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushad i tilraun $i"
              exit 0
            fi
            echo "push hafnad (tilraun $i) — endurstilli ofan a origin/main"
            git fetch origin main || { echo "::error::git fetch brast"; exit 1; }
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::rebase brast — engin gogn pushud"
              exit 1
            fi
            sleep $((i * 4))
          done
          echo "::error::push mistokst eftir 5 tilraunir"
          exit 1

      # ============================================================
      # PROFID KEYRIR EFTIR COMMIT — OG ThAD ER VIDSNUNINGUR
      # ============================================================
      # HVERS VEGNA PROF I PIPELINE-INU YFIRLEITT: skrifud skra er ekki
      # sama og NYTILEG skra. Markadslidurinn i FPL-verkefninu var daudur
      # i heila viku medan oll profin voru graen — thau profudu formuluna
      # en ekki faedid. Þetta profar faedid, og thad stendur.
      #
      # EN ThAD KEYRDI A UNDAN `git add` OG ThAD KOSTADI GOGN.
      # `tests/pipeline.mjs` getur fellt keyrsluna (dags-verdirnir), og
      # step sem fellur hér stoppar workflow-id — svo **gognin sem
      # keyrslan var buin ad saekja voru hent, ThAR MED SU DAGSMYND SEM
      # VORDURINN VAR AD VERJA**. ThRJAR CI-KEYRSLUR toputust svona a
      # draft-daginn.
      #
      # ============================================================
      # SKIPTIN SEM VAR VALIN, OG HVAD HUN KOSTAR
      # ============================================================
      # VID TOPUM: hlidid sem gat stoppad vondan commit. Repo-id getur nu
      #   innihaldid commit sem profid hafnar.
      # VID FAUM: dagsett serie tapast ALDREI ut af vordi.
      #
      # ÞRJAR ASTAEDUR FYRIR ThVI AD ThETTA SE RETT SKIPTI, OG ThAER ERU
      # EKKI SMEKKUR:
      #   1. **HLIDID A VOND GOGN ER ThEGAR TIL OG ThAD ER NAER.**
      #      `writeJson` og `writeOnce` hafna thunnum farmi PER SKRA og
      #      LATA ThA GOMLU STANDA. Þau eru vid heimildina; commit-hlidid
      #      er allt-eda-ekkert yfir ~70 skrar og getur ekki sagt "ekki
      #      thessa einu". Verndin sem taps var litil.
      #   2. **KOSTNADURINN ER OSAMHVERFUR.** Vond skra sem kemst inn er
      #      leidrett i naestu keyrslu (`data/` er endurmyndad I HEILD).
      #      Dagsmynd sem er hent er OENDURHEIMTANLEG — thad er heil
      #      forsendan fyrir `writeOnce` (README 7b).
      #   3. **BILUNIN ER ENN SYNILEG.** Stepid fellur afram, keyrslan
      #      verdur RAUD og ekkert er thagad nidur. Vid slokkvum ekki a
      #      vordinum, vid faerum hann fram fyrir hurdina.
      #
      # ÞETTA ER SAMA ROKFAERSLA OG `continue-on-error` a bokhaldinu ad
      # ofan, med einum mun sem er mikilvaegur: bokhaldid ma bregdast
      # ThOGULT (thad er maelitaeki), en ThESSI vordur a ad vera HAVAER.
      # Þess vegna `continue-on-error` EKKI hér — adeins ny stada i rodinni.
      - name: Profa ad gognin seu nytileg
        working-directory: nfl
        run: node tests/pipeline.mjs
