# Byggir appið og setur það á GitHub Pages.
# FRÍTT og ÓTAKMARKAÐ fyrir opinber repo — engin Netlify-credit.
name: pages

on:
  push:
    branches: [main]
    # aðeins þegar APPIÐ breytist — ekki við gagna-commit frá cron
    paths:
      - "src/**"
      - "nfl/src/**"
      - "nfl/index.html"
      - "nfl/vite.config.js"
      - "nfl/package.json"
      - "public/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      # LASSKRARNAR VANTADI (lagad 11.8.2026): uppfaersla a hadi sem
      # snertir ADEINS lasskrana breytti byggingunni en RÆSTI HANA EKKI,
      # svo Pages sat afram a gamla hadinu thangad til eitthvad annad
      # breyttist. Nu telja thaer sem app-breyting, thvi thad eru thaer.
      - "package-lock.json"
      - "nfl/package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ein útgáfa í gangi; nýrri ýting hættir eldri byggingu
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Setja upp pakka (FPL)
        run: npm ci --no-audit --no-fund
      - name: Byggja FPL
        run: npm run build

      # NFL-appid er sjalfstaett verkefni i `nfl/` med eigin pakka og
      # eigin vite-stillingu (sja nfl/README.md um hvers vegna).
      # ROD SKIPTIR MALI: FPL byggir i `dist/` og hreinsar hana, svo
      # NFL VERDUR ad byggja A EFTIR — annars er `dist/nfl/` thurrkad ut.
      - name: Setja upp pakka (NFL)
        working-directory: nfl
        run: npm ci --no-audit --no-fund
      - name: Byggja NFL
        working-directory: nfl
        run: npm run build
      - name: Staðfesta útkomu
        run: |
          test -f dist/index.html || { echo "dist/index.html vantar"; exit 1; }
          test -f dist/nfl/index.html || { echo "dist/nfl/index.html vantar"; exit 1; }
          echo "dist innihald:"; ls -la dist
          # 404.html = sama og index svo dýpri slóðir virki
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      # TVAER TILRAUNIR. 6.8.2026 festist deployment i "deployment_in_progress"
      # hja GitHub i 10 minutur, action-id timadi ut og keyrslan vard raud —
      # en endurkeyrslan for i gegn a 56 sekundum. Thetta var infra-hiksti
      # theirra megin (build-skrefid okkar var graent) og eina "logunin" er
      # ad reyna aftur sjalfkrafa i stad thess ad senda tolvupost og bida
      # eftir manneskju. Fyrri tilraunin faer 5 min (fost deployment er fost
      # — deploy-pages HAETTIR VID hana sjalft vid timeout) og su seinni byr
      # tha til NYJA deployment ur sama artifacti.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: "300000"
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
