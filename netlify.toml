[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

  # APPIÐ ER Á GITHUB PAGES. Netlify hýsir AÐEINS proxy-fallið, sem sækir
  # FPL-API (það sendir ekki CORS-höfuð svo vafrinn getur ekki kallað beint).
  #
  # ignore skilar 0 = "slepptu byggingu". Við byggjum því AÐEINS þegar
  # netlify/ breytist. Þar með kostar app-þróun engin Netlify-credit.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- netlify/"

[functions]
  node_bundler = "esbuild"
